          ) : filteredShops.length === 0 ? (
            <Empty icon="search" title={search ? "Aucune boutique trouvée" : "Aucune boutique pour le moment"} text={search ? "Essayez un autre mot-clé." : "Revenez bientôt, de nouveaux commerçants arrivent."}
              action={search ? <button type="button" className="btn btn-soft" onClick={function () { setSearch(""); }}>Voir toutes les boutiques</button> : null} />
          ) : (
            <div className="shops">
              {filteredShops.map(function (s) {
                return <ShopCard key={s.vendor} shop={s} info={shopInfo[s.vendor]} avg={avgOf(s.vendor)} count={countOf(s.vendor)} onOpen={openShop}
                  onReviews={function (shop) { openSheet({ type: "reviews", shop: shop }); }} />;
              })}
            </div>
          )}

          {!user ? (
            <div>
              <div className="section-head"><h2>Comment ça marche</h2></div>
              <div className="steps" style={{ marginTop: 0 }}>
              <div className="step"><span className="step-n">1</span><div><b>Créez votre compte</b><span>Gratuit, en moins d'une minute.</span></div></div>
              <div className="step"><span className="step-n">2</span><div><b>Choisissez une boutique</b><span>Parcourez les produits et ajoutez-les au panier.</span></div></div>
              <div className="step"><span className="step-n">3</span><div><b>Retirez votre commande</b><span>Vous êtes prévenu dès qu'elle est prête.</span></div></div>
              </div>
            </div>
          ) : null}

        </div>
      );
    }

    if (route === "orders") {
      page = !user ? (
        <div className="container page"><Empty icon="orders" title="Connectez-vous pour voir vos commandes" text="Vos commandes et leur avancement apparaissent ici."
          action={<button type="button" className="btn btn-primary" onClick={function () { openSheet({ type: "login" }); }}>Se connecter</button>} /></div>
      ) : (
        <div className="container page">
          {orders.length === 0 ? (
            <Empty icon="orders" title="Aucune commande pour le moment" text="Choisissez une boutique pour passer votre première commande."
              action={<button type="button" className="btn btn-primary" onClick={function () { setRoute("home"); }}>Voir les boutiques</button>} />
          ) : orders.map(function (o) { return <ClientOrder key={o.id} order={o} shopName={shopInfo[o.vendor] && shopInfo[o.vendor].title} onRate={openRating} />; })}
        </div>
      );
    }

    if (route === "sales") {
      var counts = { all: vendorOrders.length };
      Object.keys(STATUSES).forEach(function (k) { counts[k] = vendorOrders.filter(function (o) { return o.status === k; }).length; });
      var shownVendor = vendorOrders.filter(function (o) { return vendorFilter === "all" || o.status === vendorFilter; });
      var filters = [["all", "Toutes"], ["pending", "En attente"], ["preparing", "En préparation"], ["ready", "Prêtes"], ["picked", "Retirées"]];
      page = !user || !isVendor ? (
        <div className="container page"><Empty icon="package" title="Espace réservé aux vendeurs" /></div>
      ) : (
        <div>
          <div className="tabs-scroll"><div className="tabs-in" role="tablist">
            {filters.map(function (f) {
              return <button key={f[0]} type="button" role="tab" aria-selected={vendorFilter === f[0]} className={"tab" + (vendorFilter === f[0] ? " on" : "")} onClick={function () { setVendorFilter(f[0]); }}>{f[1]}<span className="n">{counts[f[0]]}</span></button>;
            })}
          </div></div>
          <div className="container page" style={{ paddingTop: 4 }}>
            {shownVendor.length === 0 ? <Empty icon="package" title="Aucune commande" text={vendorFilter === "all" ? "Les nouvelles commandes de vos clients apparaîtront ici." : "Aucune commande dans cette catégorie."} />
              : shownVendor.map(function (o) { return <VendorOrder key={o.id} order={o} onStatus={changeStatus} />; })}
          </div>
        </div>
      );
    }

    if (route === "account" && user) {
      page = (
        <div className="container page">
          <div className="profile">
            <span className="avatar lg">{initial(user.name)}</span>
            <div style={{ minWidth: 0 }}>
              <h2>{decodeEntities(user.name)}</h2>
              <p>{user.email}</p>
              <div className="roles">
                <span className="role client">Client</span>
                {isVendor ? <span className="role vendor"><Icon name="store" size={12} /> Vendeur · {vendorName}</span> : null}
                {isAdmin ? <span className="role admin"><Icon name="shield" size={12} /> Admin</span> : null}
              </div>
            </div>
          </div>

          <div className="list">
            <div className="info-row"><Icon name="phone" size={20} /><div><small>Téléphone</small>{user.phone || "Non renseigné"}</div></div>
            <div className="info-row"><Icon name="pin" size={20} /><div><small>Adresse</small>{user.address || "Non renseignée"}</div></div>
          </div>

          <div className="list">
            <button type="button" className="list-item" onClick={function () { openSheet({ type: "profile" }); }}>
              <span className="list-ico"><Icon name="edit" size={20} /></span><span><b>Modifier mon profil</b><small>Nom, téléphone, adresse</small></span><span className="chev"><Icon name="chevron" size={18} /></span>
            </button>
            {isVendor ? (
              <button type="button" className="list-item" onClick={function () { setRoute("sales"); }}>
                <span className="list-ico"><Icon name="package" size={20} /></span><span><b>Mes ventes</b><small>{pendingVendor ? pendingVendor + " nouvelle(s) commande(s)" : "Commandes de ma boutique"}</small></span><span className="chev"><Icon name="chevron" size={18} /></span>
              </button>
            ) : null}
          </div>

          {isAdmin ? (
            <div>
              <div className="section-head"><h2>Administration</h2></div>
              <div className="stats">
                <div className="stat"><b>{users.length || "–"}</b><span>Utilisateurs</span></div>
                <div className="stat"><b>{shops.length}</b><span>Boutiques</span></div>
                <div className="stat"><b>{vendors.length || "–"}</b><span>Vendeurs</span></div>
              </div>
              <div className="list">
                <button type="button" className="list-item" onClick={function () { goAdmin("users"); }}>
                  <span className="list-ico"><Icon name="users" size={20} /></span><span><b>Utilisateurs</b><small>Voir les comptes et les droits admin</small></span><span className="chev"><Icon name="chevron" size={18} /></span>
                </button>
                <button type="button" className="list-item" onClick={function () { goAdmin("vendors"); }}>
                  <span className="list-ico"><Icon name="store" size={20} /></span><span><b>Vendeurs</b><small>Associer un compte à une boutique</small></span><span className="chev"><Icon name="chevron" size={18} /></span>
                </button>
              </div>
            </div>
          ) : null}

          {!isStandalone && installEvt ? (
            <div className="install">
              <span className="list-ico"><Icon name="download" size={20} /></span>
              <div><b>Installer SOG</b><span>Accès direct depuis votre écran d'accueil.</span></div>
              <button type="button" className="btn btn-primary btn-block" onClick={install}>Installer l'application</button>
            </div>
          ) : null}
          {!isStandalone && !installEvt && isIOS ? (
            <div className="install">
              <span className="list-ico"><Icon name="download" size={20} /></span>
              <div><b>Installer SOG</b><span>Dans Safari, touchez « Partager » puis « Sur l'écran d'accueil ».</span></div>
            </div>
          ) : null}

          <div className="list">
            <button type="button" className="list-item" onClick={doLogout}>
              <span className="list-ico danger"><Icon name="logout" size={20} /></span><span><b style={{ color: "var(--danger)" }}>Se déconnecter</b></span><span></span>
            </button>
          </div>
        </div>
      );
    }

    if (route === "users" && isAdmin) {
      var uq = fold(userSearch.trim());
      var shownUsers = users.filter(function (u) { return !uq || fold((u.name || "") + " " + (u.email || "") + " " + (u.phone || "")).indexOf(uq) > -1; });
      page = (
        <div className="container page">
          <div className="search" style={{ marginTop: 0 }}>
            <span className="s-icon"><Icon name="search" size={20} /></span>
            <input type="search" placeholder="Rechercher un utilisateur…" aria-label="Rechercher un utilisateur" value={userSearch} onChange={function (e) { setUserSearch(e.target.value); }} />
          </div>
          <div className="section-head"><h2>{shownUsers.length} compte{shownUsers.length > 1 ? "s" : ""}</h2></div>
          {shownUsers.length === 0 ? <Empty icon="users" title="Aucun utilisateur" /> : shownUsers.map(function (u) {
            var me = u.uid === user.uid;
            return (
              <div className="row" key={u.uid}>
                <span className="avatar">{initial(u.name || u.email)}</span>
                <div style={{ minWidth: 0 }}>
                  <div className="row-name">{decodeEntities(u.name || u.email)}{u.isAdmin ? <span className="role admin" style={{ marginLeft: 8 }}>Admin</span> : null}</div>
                  <div className="row-meta">{decodeEntities(u.email)}{u.phone ? " · " + decodeEntities(u.phone) : ""}</div>
                </div>
                <button type="button" className={"btn btn-sm " + (u.isAdmin ? "btn-danger" : "btn-soft")} disabled={me} onClick={function () { askToggleAdmin(u); }} aria-label={(u.isAdmin ? "Retirer admin : " : "Nommer admin : ") + (u.name || u.email)}>
                  {me ? "Vous" : u.isAdmin ? "Retirer" : "Admin"}
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    if (route === "vendors" && isAdmin) {
      page = (
        <div className="container page">
          <form className="panel" style={{ marginTop: 0 }} onSubmit={addVendor}>
            <h3>Ajouter un vendeur</h3>
            <Field id="v-name" label="Nom de la boutique" hint="Le même nom que celui du forkeur, par exemple « milo »."><input id="v-name" className="input" autoCapitalize="none" value={newVendor.name} onChange={function (e) { setNewVendor({ name: e.target.value, email: newVendor.email }); }} /></Field>
            <Field id="v-email" label="Email du vendeur" hint="Le vendeur doit avoir créé un compte SOG avec cet email."><input id="v-email" className="input" type="email" inputMode="email" autoCapitalize="none" value={newVendor.email} onChange={function (e) { setNewVendor({ name: newVendor.name, email: e.target.value }); }} /></Field>
            <button type="submit" className="btn btn-primary btn-block" disabled={busy === "vendor"}>{busy === "vendor" ? "Ajout…" : "Ajouter le vendeur"}</button>
          </form>
          <div className="section-head"><h2>Vendeurs enregistrés</h2><span>{vendors.length}</span></div>
          {vendors.length === 0 ? <Empty icon="store" title="Aucun vendeur enregistré" /> : vendors.map(function (v) {
            return (
              <div className="row" key={v.key}>
                <span className="avatar">{initial(v.name || v.key)}</span>
                <div style={{ minWidth: 0 }}><div className="row-name">{decodeEntities(v.name || v.key)}</div><div className="row-meta">{decodeEntities(v.email)}</div></div>
                <button type="button" className="icon-btn sm" style={{ color: "var(--danger)" }} aria-label={"Supprimer " + (v.name || v.key)} onClick={function () { askDeleteVendor(v); }}><Icon name="trash" size={20} /></button>
              </div>
            );
          })}
        </div>
      );
    }

    if (!page) page = <div className="container page"><Empty icon="alert" title="Page indisponible" action={<button type="button" className="btn btn-primary" onClick={function () { setRoute("home"); }}>Retour à l'accueil</button>} /></div>;

    var reviewShop = sheet && sheet.type === "reviews" ? sheet.shop : null;

    return (
      <div>
        {header}
        {page}

        <nav className="nav" aria-label="Navigation principale">
          <div className="nav-in">
            {navItems.map(function (n) {
              var on = navActive === n.id;
              return (
                <button key={n.id} type="button" className={"nav-item" + (on ? " on" : "")} aria-current={on ? "page" : undefined} onClick={function () { onNav(n.id); }}>
                  <i className="pill-bg"></i>
                  <span style={{ position: "relative", display: "inline-flex" }}><Icon name={n.icon} size={22} />{n.badge ? <span className="badge">{n.badge}</span> : null}</span>
                  <span>{n.label}</span>
                </button>
              );
            })}
          </div>
        </nav>

        {/* ---- boutique en plein écran ---- */}
        {selectedShop ? (
          <div className="shop-view">
            <iframe
              ref={iframeRef} key={selectedShop.vendor} src={selectedShop.url} title={selectedShop.name}
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
              onLoad={function () { setFrameLoaded(true); sendAuth(userRef.current); }}
            />
            {!frameLoaded ? (
              <div className="shop-loading"><div className="spinner"></div><div>Ouverture de {selectedShop.name}…</div></div>
            ) : null}
            <button type="button" className="back-btn" onClick={closeShop} aria-label="Retour aux boutiques"><Icon name="back" size={20} /> Retour</button>
          </div>
        ) : null}

        {/* ---- feuilles ---- */}
        {sheet && sheet.type === "login" ? (
          <LoginSheet busy={busy === "login"} error={sheetError} info={sheetInfo} onSubmit={doLogin} onReset={doReset} onClose={closeSheet}
            onSwitch={function () { openSheet({ type: "register" }); }} />
        ) : null}
        {sheet && sheet.type === "register" ? (
          <RegisterSheet busy={busy === "register"} error={sheetError} onSubmit={doRegister} onClose={closeSheet} onSwitch={function () { openSheet({ type: "login" }); }} />
        ) : null}
        {sheet && sheet.type === "profile" && user ? (
          <ProfileSheet user={user} busy={busy === "profile"} error={sheetError} onSubmit={doProfile} onClose={closeSheet} />
        ) : null}
        {sheet && sheet.type === "rating" ? (
          <RatingSheet vendor={sheet.vendor} initial={sheet.initial} busy={busy === "rating"} onSubmit={doRating} onClose={closeSheet} />
        ) : null}
        {reviewShop ? (
          <ReviewsSheet name={(shopInfo[reviewShop.vendor] && shopInfo[reviewShop.vendor].title) || reviewShop.name} ratings={ratings[reviewShop.vendor] || {}} onClose={closeSheet}
            onRate={function () { openRating(reviewShop.vendor); }} />
        ) : null}
        {confirm ? <Confirm title={confirm.title} text={confirm.text} yesLabel={confirm.yesLabel} danger={confirm.danger} onYes={confirm.onYes} onNo={function () { setConfirm(null); }} /> : null}

        {toast ? (
          <div className="toasts" role="status" aria-live="polite"><div className={"toast " + toast.type}>{toast.text}</div></div>
        ) : null}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
